# sa-ru 本体 — TaskClassifier / RiskClassifier / ConversationManager が参照
sa-ru:
  model: "qwen3.6:35b-a3b-q4_K_M"      # 脳モデル（会話フロントエンド＋stdout文脈抽出。テキスト＋画像 vision）。
                                       # gemma4:12b から入替（設計書 §2.1: 隠れ思考＋23tok/s が会話遅延の
                                       # 支配項と実測特定。MoE アクティブ3B で生成高速化）
  num_ctx: 32768                       # コンテキスト長。既定だとモデル上限 256K で常駐し KV が膨張するため
                                       # 32K に制限（gemma4 実測: 262144 常駐で 9.6GB。会話は head+tail 二窓
                                       # 丸めのため 32K で十分）。deploy が Modelfile へ焼込（ya-ta と同機構）
  llm_think: false                     # 会話は応答速度優先で思考を無効化（実測: 思考ありは 1400 トークン/
                                       # 30 秒、think=false で 26 トークン/0.9 秒。判定品質が要る分解・
                                       # リスク判定側は思考維持＝ya-ta.yaml には置かない）
  ollama_host: "http://localhost:11434" # ollama API エンドポイント（Mac mini localhost）
  converse_timeout_sec: 120            # 会話 LLM（ollama HTTP API）1 ターンのタイムアウト。実測 p95 に余裕を
                                       # 載せて調整する（設計書 §8.4。HTTP API 化・モデル入替後に実測で見直す）

# LLM 処理待ちのハートビート進捗通知（§10.8）— Orchestrator._run_with_heartbeat が参照
heartbeat:
  interval_sec: 30  # 進捗通知（経過秒＋生成トークン数）を同スレッドへ返す間隔。コード側に既定値なし（SSOT）

# 会話フロントエンド — ConversationManager / _conversation_loop が参照
conversation:
  dir: "/opt/taka-ma/data/conversations"  # u-zu が発話を書き込む会話キュー（sa-ru が走査）
  poll_interval_sec: 2                    # 未処理発話がないときのポーリング間隔
  session_ttl_sec: 3600                   # セッションをメモリに保持する上限秒。超過した未使用会話はメモリから
                                          # アンロード（永続化ファイルは残り、次の発話で回復。設計書 §8.3）
  sessions_dir: "/opt/taka-ma/data/conversations/sessions"  # セッション永続化の保存先（原子書込）
  history_head_turns: 4                   # 脳 LLM ビューの冒頭窓（ターン数・§8.3 (C) head+tail）。スレッド冒頭の
                                          # 依頼前提を履歴がどれだけ伸びても残す（2026-08-10 F3 再発防止）
  history_tail_turns: 16                  # 脳 LLM ビューの直近窓（ターン数）。冒頭窓と合わせ従来の 20 ターン
                                          # 相当のプロンプト上限を維持（永続化ファイル側は丸めず全量保持）

# 着手確認ゲート（§8.3 (B)）— _exec_confirmation_loop が参照
# pending に期限は設けない（§8.10b。人間がボタンで決着させるまで待つ）
exec_confirm:
  dir: "/opt/taka-ma/data/exec-confirmations"  # 着手確認レコードの読み書き先（u-zu がボタンで status 更新）
  poll_interval_sec: 2                          # 確認決着のポーリング間隔

# 制御コマンド受信（§8.10c）— _control_loop が参照
control:
  dir: "/opt/taka-ma/data/controls"  # u-zu が制御命令（手動 ollama 停止等）を書き込む先（sa-ru が走査）
  poll_interval_sec: 2               # 未処理命令がないときのポーリング間隔

# SSH — RemoteProcessManager が参照
ssh:
  mbp_host: "mbp"  # ~/.ssh/config のHost名
  timeout_sec: 30  # ollama ps/stop・Blender 検知など軽い SSH 操作の応答待ち上限（秒）。モデル実行など重い操作は run_ssh_command 既定 120

# headless アダプタ（Claude Code の claude -p 実行）— Orchestrator._run_worker_headless が参照
headless:
  mini_host: "mac-mini"                                # MBP 上のフックから見た Mac mini の SSH ホスト名（~/.ssh/config。実機の
                                                        # ~/.ssh/config には "mini" エイリアスが存在せず "mac-mini" が正。
                                                        # 実機検証で解決不能を確認・是正）
  decide_client: "/opt/taka-ma/sa-ru/approval-pipeline/decide_client.py"  # Mac mini 上のフック薄クライアント
                                                        # （標準ライブラリのみ＝PYTHONPATH 不要。判定本体は
                                                        # 常駐 decide デーモン。設計 Appendix §2.1）
  decide_socket: "/opt/taka-ma/data/decide.sock"       # decide デーモン（com.taka-ma.decide-daemon）の UDS
  python_bin: "/opt/taka-ma-env/bin/python3"           # decide_client.py 実行バイナリ（標準ライブラリのみの
                                                        # ため素の python3 でも可だが、存在が deploy で保証
                                                        # される venv を既定にする）
  hook_timeout_sec: 310                                # PreToolUse フックの上限（Tier3 人間待ち 300 秒を切らない値）
  run_timeout_sec: 1800                                # claude -p 1 回の全体上限（秒）
  stream_limit_bytes: 10485760                         # stream-json 1 行の読取上限（10MB）。既定 64KB では大きい
                                                        # ファイルを読んだ tool_result 1 行で行長超過となり、読取
                                                        # エラーが「難所」と誤解釈され偽昇格を起こした（設計 §8.5・
                                                        # 2026-08-30 実測）。値の管理はここが唯一の源（コード定数なし）

# worker 起動前の認証プリフライト（SSH / git remote / Anthropic）— AuthPreflight が参照
# （Orchestrator._run_worker_headless が worker 起動直前に呼ぶ。コード側に既定値なし・SSOT）
preflight:
  ssh_timeout_sec: 15         # ssh <mbp> true（到達性・認証検査）の応答上限（秒）
  git_timeout_sec: 30         # git ls-remote（remote 到達性検査）の応答上限（秒）
  anthropic_timeout_sec: 120  # worker CLI 最小プローブ（Anthropic 認証検査。実推論 1 回ぶん）の応答上限（秒）
  pass_ttl_sec: 600           # 検査 PASS の再検査省略期間（秒）。多段 worker 起動でプローブを毎回払わない
  fail_ttl_sec: 60            # 検査 FAIL の再検査省略期間（秒）。昇格ラダー再突入で同じ検査・通知を重ねず、
                              # 復旧後の再試行は長く塞がない

# タスクキュー — dispatcher が参照
task_queue:
  dir: "/opt/taka-ma/data/tasks"  # Slack Bot がタスクファイルを作成するディレクトリ
  poll_interval_sec: 5            # 未処理タスクがないときのポーリング間隔

# 承認パイプライン — ApprovalPipeline が構築時に Tier2/Tier3 ハンドラへ注入（コード側に既定値なし）
approval:
  dir: "/opt/taka-ma/data/approvals"  # 承認ファイルの読み書き先（u-zu と共有。実配線は環境変数
                                      # TAKA_MA_APPROVAL_DIR — 別ツリー配備の u-zu と供給元を揃えるため）
  tier2_timeout_sec: 120              # qu-e 審査（SSH + review_cli 1 ショット）の応答待ち上限（秒）
  hold_grace_sec: 60                  # 人間承認を worker に待たせる上限（秒）。これは「承認の期限」ではなく
                                      # 「worker を待たせる上限」。超過したら承認は pending のまま生かし、
                                      # worker だけ畳んで枠を返す（§3.3 (4) / §8.10）。自動 deny はしない
  max_reinject: 3                     # 同一タスクの再投入回数の上限。承認と再投入が循環して収束しない場合に
                                      # failed へ倒し、収束しなかったことを Slack へ明示する（§8.10）
  poll_interval_sec: 1                # 承認待ち中のポーリング間隔／保留レコードの決着監視間隔

# §8.10f 会話⇄実行の受け渡し契約 — ConversationManager（契約化パス）/ Orchestrator が参照。
# このブロックの有無で契約機能が有効化される（未構成なら従来動作＝段階導入）
contract:
  intents_dir: "/opt/taka-ma/data/intents"      # intent レコード（依頼の寿命 goal_status）の保存先
  task_deny_dir: "/opt/taka-ma/data/task-deny"  # 禁止型拘束のタスク別 deny 規則。decide デーモンは
                                                # 環境変数 TAKA_MA_TASK_DENY_DIR（既定値は同パス）で
                                                # 同じ場所を読む（grep で両側一致を確認する）

# モデル関連設定（routing / fallback / concurrency / models）は ya-ta.yaml に集約。
# Orchestrator 起動時に ya-ta.yaml と当ファイルをマージして単一 config を構築する。

# Blender モード — ResourceMonitor が参照
resource_management:
  blender_detection: true   # Blender プロセス検知の有効/無効
  blender_action: "stop_llm" # 検知時のアクション
  check_interval_sec: 10    # Blender 検知のポーリング間隔

# アーカイブローテート — _daily_cleanup() が参照
cleanup:
  retention_days: 90  # タスクアーカイブ（done/）の保持日数。判定ログは永続保持

# qu-e ヘルス監視 — dispatcher が参照（SSH 経由で MBP のファイルを取得）
qu-e:
  # model: qwen3.6:35b-a3b-q4_K_M — qu-e 自身の設定ファイル（/opt/taka-ma/qu-e/config/qu-e.yaml）で管理
  health_poll_interval_sec: 60                          # ヘルスチェック取得間隔
  health_file: "/opt/taka-ma/logs/qu-e-health.json" # MBP 上のヘルスチェック結果ファイル

# file_audit アラート受信 — FileAuditHandler（watchdog）が参照（§8.12）
file_audit:
  alert_dir: "/opt/taka-ma/data/file-audit-alerts"  # qu-e からの SSH push 受信先（watchdog で監視）

# §8.13 タスクコンテキスト送信 — Orchestrator._push_task_context() / ConversationManager が参照
task_context:
  remote_dir: "/opt/taka-ma/data/task-context"  # MBP 上の qu-e 受信先
  workspace_base: "/opt/taka-ma/work"           # タスク専用作業ディレクトリの基底（実体は {base}/{task_id}）
  worker_home: "/Users/youruser"                # worker ホスト（MBP）の HOME 絶対パス。repo: / 自然文リポジトリ
                                                # 指定の `~/` 前置きをこの値で展開する（§8.13 / #143。sa-ru は
                                                # MBP 側ホームを自力解決できない。未設定なら ~ 指定は差し戻し）

# §8.14 リソース最適化通知 受信 — ResourceNotifyHandler（watchdog）が参照
# qu-e から SSH push される推奨 heavy 並行数で max_heavy_instances を動的更新する
resource_optimization:
  notify_dir: "/opt/taka-ma/data/resource-notify"  # qu-e からの SSH push 受信先（Mac mini、watchdog で監視）
