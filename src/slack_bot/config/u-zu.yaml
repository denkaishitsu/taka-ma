# u-zu 本体 — main.py の Socket Mode 死活監視（services/socket_watchdog.py）が参照
#
# 運用値はこの yaml が唯一の源（SSOT）。コード側に既定値は置かない（キー欠落は起動時に失敗させ、
# 監視なしのまま常駐する偽正常を防ぐ）。
watchdog:
  check_interval_sec: 60     # 死活確認の周期。pong 受信時刻を読むだけの軽い処理のため分単位で十分
  stale_threshold_sec: 180   # pong 途絶をこの秒数超過で half-open と判定。Slack の ping は数十秒間隔の
                             # ため、正常時にこの長さの無受信は起きない。検出遅延は最悪で
                             # threshold + interval（既定 240 秒）

# 上り発話の正規化（設計書 §8.3「上り発話の正規化」）— handlers/events.py が参照
#
# Slack はユーザー本人の認可でアプリが投稿した発話の本文末尾へ、アプリ帰属表記
# （*<文言>* <アプリ名>）を追記する。抑止する設定は Slack 側に無い。これが残ると
# sa-ru の意図解釈に常時ノイズが乗り、訂正の簡易記法（§10.2.1）は行全体をアンカーする
# 決定的パースのため必ず不一致になる。会話キューへ入れる前に落とす。
inbound_sanitize:
  # 除去対象のアプリ。判定は Slack イベントの app_id の完全一致で行う。人手で打った発話に
  # app_id は付かないため、ユーザーが同じ文字列で終わる発話をしても巻き込まない。
  # ここに載らない app_id の投稿は加工しない（他社アプリへ干渉しない）。空リストで機能停止。
  apps:
    # taka-ma-mcp（G2 リレーが上り中継に使う Slack アプリ）
    - app_id: "A0BGPDZMFR9"
      # 実測した文字列をそのまま列挙する（前方の空白込みで末尾完全一致）。表示言語・アプリ名
      # ごとに 1 行ずつ足す。構造推定（正規表現）にしないのは、原文が同じ形で終わったときに
      # 過剰除去となり、決定的であるべき訂正記法を壊すため。
      attribution_suffixes:
        - " *使用して送信されました* taka-ma-mcp"
