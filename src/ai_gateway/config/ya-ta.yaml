# ya-ta 設定
ya-ta:
  model: "qwen3.8:27b"        # タスク分解・分類・リスク判定に使うモデル（ollama HTTP API 経由）。
                              # qwen3.6:27b-q4_K_M から入替（2026-08-26 承認 model-swap-88d44ca66a6a。
                              # 一度ロールバック後、同日再換装）。根拠: 公式カードの直接比較で全項目優位
                              # （IFBench 79.5 vs 69.1・GPQA 89.2 vs 87.8 ほか）、速度は同日実測で同等
                              # （分解 21.8 vs 20.1 秒・分解 20 秒台の主因はプロンプト肥大で別件）。
                              # claims: docs/claims/model-swap_ya-ta_qwen3.6-27b_to_qwen3.8-27b.md
  risk_model: "qwen3.6:35b-a3b-q4_K_M"  # 承認ゲートのリスク分類（Tier 1/2/3）専用モデル。分解用の
                              # 27b（dense）と分けるのは、リスク分類が worker のツール呼び出しごとに
                              # 同期で挟まり、レイテンシがツール数に比例して worker の実行時間を支配
                              # するため（実測 2026-07-29: 1 worker ステップ 68.6 秒のうち承認判定
                              # 47.3 秒＝69%）。MoE（アクティブ 3B）は同一プロンプト・同一 tier 判定で
                              # 大幅に速い（実測 2026-07-30・Mac mini・両モデル常駐・5 操作:
                              # 27b dense 9.4〜12.8 秒 → 35b-a3b 2.0〜2.4 秒。tier は 5 操作すべて一致）。
                              # sa-ru の会話脳と同一モデルのため常駐は 1 本で足り、追加メモリは不要
  llm_timeout_sec: 300        # 分解・分類・リスク判定 1 回のタイムアウト。旧値 60 秒は正常分解の
                              # 実測 58 秒と同水準で、正常動作でも受付失敗する際どい設定だった。
                              # 思考型モデルは思考が長引き得るため余裕を大きく取る。実測ログ
                              # （llm.py の total_duration INFO）が溜まったら p95 基準で見直す（§8.4）
  correction_timeout_sec: 60  # 計画プレビューの自然言語訂正（PlanCorrector）1 回のタイムアウト。
                              # 分解より短くするのは、訂正解釈が会話の応答を塞ぐ位置に在るため
                              # （計画確認中の発話は訂正解釈 → 通常会話の順に流れる。設計書 §10.2.1）。
                              # ya-ta が詰まったときに llm_timeout_sec（300 秒）まで会話が無応答に
                              # なるのを避け、打ち切って通常会話へ落とす
  llm_think: false            # 分解・分類・リスク判定の思考無効化。qwen3.6:27b は思考ありで分解
                              # 281 秒/3352 トークン（timeout 300 秒とニアミス・旧 deepseek 58 秒
                              # より大幅悪化）を実測。think=false の品質は分解構造の実機確認で判断
  num_ctx: 32768              # コンテキスト長。Mac mini 64GB での sa-ru 同居のため上限（256K）で
                              # 常駐させず 32K に制限（旧 deepseek 実測: 128K=常駐47GB → 32K=26GB。
                              # qwen3.8:27b は 32K で実常駐 18GB 実測・2026-08-26）。
                              # ※ コードは HTTP API で num_ctx を渡さないため、実効値は
                              #   モデル側 Modelfile の PARAMETER num_ctx 32768 に焼き込んで担保する
                              #   （構築手順書 04 §1-2 参照。初期投入時に PyInfra が自動焼込）。

# ルーティング写像（light/heavy 2値 → execution × depth 直交2軸）
# ya-ta は execution/depth/confidence の生判定のみ返し、モデルへの写像は orchestrator が
# 本テーブルを唯一の源として行う（ya-ta はモデル名を決めない＝関心の分離）。
routing:
  # confidence がこの値未満なら「迷い」とみなし matrix の low 側（sonnet）へ落とす。
  # 暫定値。判定ログ（YaTaLogger）の実データで較正する（設計書 §2.2「閾値・rubric は実データで較正」）
  confidence_threshold: 0.8

  # execution × depth × confidence → モデル（設計書 §2.2 写像テーブル）
  #   high = confidence >= confidence_threshold, low = confidence < threshold
  #   depth 省略時は unspecified を用いる（agent のみ）。inline は depth 不問
  matrix:
    inline:
      high: gemma       # ローカル純生成で完結
      low: haiku        # 生成だが迷い → 安価な API で確実に
    agent:
      shallow:
        high: haiku     # 浅いエージェント作業
        low: sonnet     # 迷いの落下先
      deep:
        high: opus      # 深い設計・難所
        low: sonnet     # 迷いの落下先
      unspecified:      # depth 省略（判断がつかない）
        high: sonnet    # 中位・万能
        low: sonnet

  # 昇格ラダー — 実行時に worker が難所に当たった / ESCALATE 申告 / 例外・タイムアウト時に
  # 段階的にモデルを上げて再実行する。現モデルがラダー上にあれば次段、ラダー外(gemma)なら先頭から。
  # 暫定の段構成。判定ログの過昇格/過小昇格の実データで較正する（設計書 §2.2）
  escalation:
    ladder: [haiku, sonnet, opus]

# モデル登録 — ルーティング先の定義
# キー名 = ユーザーが :モデル名 で指定する名前（完全一致）
#
# methods: 対応する呼び出し経路（実行アダプタ）の配列
#   - headless:   claude -p（非対話・stream-json）+ PreToolUse フック承認。Claude Code 専用
#   - pty:        SSH + PTY ラッパー（pexpect + tmux）。agy 対話等、y/n 介入が要る汎用対話 CLI 用
#   - subprocess: SSH + subprocess 単発実行。マルチモーダル単発・cross-review・フォールバックなど対話不要なもの
# 複数指定可（例: gemini は pty と subprocess の両方に対応）。
# 経路選択は orchestrator がタスクの性質（対話 / 単発、cross-review、マルチモーダル）から動的に決める。
#
# command: worker CLI の起動コマンド名（PTY ラッパー / subprocess 共通で使用）
#   - 通常は vendor から自動推測される（anthropic → claude、google → gemini 等）
#   - 自動推測を上書きしたい場合のみ明示記述する（複数 CLI 提供ベンダー・自前 CLI 等）
models:
  opus:
    full_name: "claude-opus-5"
    type: api
    vendor: anthropic
    methods: [headless]
    command: claude
    model_flag: "--model opus" # heavy デフォルト（明示指定必須。claude CLI 既定は端末の ~/.claude/settings.json
                                # の model 設定に従うため無指定だと Opus 5 が保証されない。実機検証で確認済。
                                # エイリアス opus は 2026-07-25 実機で Claude Opus 5 に解決）
    capabilities: [code, design, reasoning, implementation]
    description: "重量タスクの既定。探索・試行錯誤・ツール使用を伴う作業"

  fable:
    full_name: "claude-fable-5"
    type: api
    vendor: anthropic
    methods: [headless]
    command: claude
    model_flag: "--model fable"   # claude CLI の --model はエイリアス（fable/opus/sonnet/haiku）を取る。
                                   # full_name の "claude-fable-5" は不可（実機検証で拒否を確認）
    capabilities: [code, design, reasoning, implementation]
    description: "最難関タスク用。:fable で明示指定（難易度自動振り分けは Phase2）"

  sonnet:
    full_name: "claude-sonnet-5"
    type: api
    vendor: anthropic
    methods: [headless]
    command: claude
    model_flag: "--model sonnet"   # エイリアス指定（"sonnet-5"等のバージョン付き値は無効・実機検証で拒否を確認）。
                                    # エイリアス sonnet は 2026-07-25 実機で Claude Sonnet 5 に解決
    capabilities: [code, reasoning]
    description: "中量タスク。Opus より高速・低コスト"

  haiku:
    full_name: "claude-haiku-4-5-20251001"
    type: api
    vendor: anthropic
    methods: [headless]
    command: claude
    model_flag: "--model haiku"   # エイリアス指定（"haiku-4.5"は無効値・実機検証で拒否を確認）。
                                   # Claude 5 世代でも Haiku は 4.5 が最新（2026-07-25 実機で確認）
    capabilities: [light-task, qa]
    description: "軽量タスク。高速応答"

  gemini:
    full_name: "gemini-3.6-flash"
    type: api
    vendor: google
    methods: [subprocess]        # 単発のみ（高度なマルチモーダル解析 / cross-review / フォールバック）。
                                 # pty を外した理由（2026-07-28）: pty の承認配線は実機 E2E で一度も
                                 # 検証されておらず（E2E T08-V23 は未実施）、承認プロンプトに誰も
                                 # 答えなかったときの挙動も未測定。未検証の承認経路を有効なまま
                                 # 残すより閉じる方が安全と判断した（設計 §8.6）。
                                 # 再開の条件: 無応答時の挙動を実測し fail-closed を確認すること。
                                 # 実測は agy のクォータ枯渇（2026-07-28 時点で復帰まで約 96 時間）で保留中
    command: agy                 # Antigravity CLI（Gemini CLI の後継）。認証は macOS keychain 依存（設計書 §8.5/§8.6）
    keychain_auth: true          # 認証が macOS keychain 依存 → SSH 直実行不可。GUI 起源 tmux 内で実行（§8.6）
    model_flag: "-p"   # agy: -p=非対話単発。--model は付加しない — agy 既定が 3.6 Flash (High) へ更新された
                        # ため省略で要件を満たす。本番経路（GUI 起源 tmux）でログ実測・2026-07-26:
                        #   --model なし → label="Gemini 3.6 Flash (High)"
                        # --model を併用する場合は必ず -p より前に置き、値は括弧付きの表示名にする
                        # （"-high" スラッグは解決されず既定へ黙って落ちる。gemini-pro 側コメント参照）
    capabilities: [multimodal-analysis, code, reasoning]
    capability_description: |
      - 動画・音声・画像の高度な解析（理解）を含むタスク → model: "gemini"
        （基本的な解析はローカル gemma4 が担当。生成は Phase 2 — 設計書 §2.4 参照）
      - heavy 対話タスクのセカンドオピニオン → cross-review
      - Opus 障害時のフォールバック（テキスト・コード）
    description: "Gemini 既定（3.6 Flash）。高速・低コストで高度なマルチモーダル解析 + heavy 対話"

  gemini-pro:
    full_name: "gemini-3.1-pro"
    type: api
    vendor: google
    methods: [subprocess]        # subprocess 単発のみ。pty を外した理由: 下の model_flag は
                                 # 二重引用符と括弧を含み、PTY 経路の起動文字列
                                 # （pty_wrapper._build_invocation → ssh -tt 'tmux new-session … "<invocation>"'）
                                 # の入れ子クォートを壊す（remote zsh が `no matches found: (High) -p` で失敗。
                                 # 2026-07-25 に同一構成文字列で再現）。:gemini-pro の用途（高度な
                                 # マルチモーダル解析の単発・長文脈）は subprocess で満たせる。
                                 # PTY 経路のクォート堅牢化は別タスク #129 で対応する
    command: agy
    keychain_auth: true
    model_flag: '--model "Gemini 3.1 Pro (High)" -p'   # agy: 最上位を明示選択。2026-07-03 に無効だった 2 点は
                                                        # agy 1.1.7 実機（2026-07-26）で解消を確認:
                                                        # (a) 語順を "--model X -p <prompt>" にすれば -p が
                                                        #     プロンプトを正しく取る（--model を -p の後ろに
                                                        #     置くと --model がプロンプトとして消費される）。
                                                        # (b) モデル名は括弧付きの表示名（"Gemini 3.1 Pro (High)"）
                                                        #     でなければ切替わらない。旧値 "gemini-3.1-pro" が
                                                        #     無効だった真因はこれ。
                                                        # ⚠️ `agy models` の出力を写経しないこと: 1.1.7 の
                                                        #    `agy models` はスラッグ（gemini-3.1-pro-high）を出すが、
                                                        #    --model はスラッグを一部しか解決できない。本番経路
                                                        #    （GUI 起源 tmux）での実測 2026-07-26:
                                                        #      gemini-3.1-pro-high  → Gemini 3.6 Flash (High)  ✗
                                                        #      gemini-3.1-pro-low   → Gemini 3.1 Pro (Low)     ○
                                                        #      "Gemini 3.1 Pro (High)" → Gemini 3.1 Pro (High) ○
                                                        #    両方とも `agy models` に載るのに -high だけ解決されない
                                                        #    ＝ agy 側のマッピング欠落。エラーにならず黙って既定へ
                                                        #    落ちるため、値を変えたら必ず下記で実測すること。
                                                        # 検証方法（モデルの自己申告は実測で揺れるため使わない）:
                                                        #   agy --log-file /tmp/a.log --model <X> -p 'say ok'
                                                        #   grep 'Propagating selected model override' /tmp/a.log
                                                        #   → label="Gemini 3.1 Pro (High)" を確認
                                                        # NOTE: ログには `not logged into Antigravity`
                                                        #   （load code assist / ListExperiments のポーリング失敗）が
                                                        #   常時 20 件前後出るが、モデル選択・推論とは無関係。
                                                        #   CLI 再ログイン後も消えないことを確認済み（2026-07-26）。
                                                        #   この警告を認証障害と誤読して調査しないこと
    capabilities: [multimodal-analysis, code, reasoning]
    capability_description: |
      - 複雑・創造的タスクで Gemini の最上位が要るとき → model: "gemini-pro"
      - 1M トークン級の長文脈が要るタスク
    description: "Gemini 最難関用（3.1 Pro）。:gemini-pro で明示指定（自動振り分けは Phase2）"

  gemma:
    full_name: "gemma-4-31b"
    type: local
    methods: [subprocess]
    command: ollama              # 参考表示用（実行は下の api_url へ HTTP。CLI は起動しない）
    model_id: "gemma4:31b"
    api_url: "http://localhost:11434/api/generate"  # MBP 上の ollama 生成エンドポイント。
                                 # localhost は「MBP 自身から見た」の意（SSH で MBP に入ってから
                                 # curl で叩く。ポートは開けない＝通信方式は SSH のまま）
    keep_alive_sec: 1800         # 生成後にモデルを常駐させ続ける秒数。CLI 単発（旧実装）は
                                 # 呼び出しごとにモデルロードを払い、inline 1 件に 68 秒 / 146 秒を
                                 # 要していた（2026-07-29 本番ログ実測）。MBP は worker と qu-e が
                                 # メモリを分け合うため無期限（-1）は取らず、30 分で解放する
    capabilities: [inline-generation, qa]   # inline 純生成専用へ降格。
                                             # ファイル読み取り・フォーマット変換は capability から外した
                                             # （ツール文脈が要る作業は agent レーンが担う）
    description: "ローカル軽量。inline 純生成専用（外部通信不要）"

  # 外部サービスの追加例:
  # suno:
  #   full_name: "suno-v4"
  #   type: api
  #   vendor: suno
  #   methods: [subprocess]
  #   command: suno
  #   capabilities: [music-generation]
  #   capability_description: |
  #     - 音楽の作曲・編曲・生成を含むタスク → model: "suno"
  #   description: "音楽生成"

# 並行実行制御
concurrency:
  # 重量モデル（methods に pty を含むモデル）の同時実行数上限。
  # 起動時のブートストラップ値（実行時は qu-e のリソース最適化通知 §8.14 で動的増減する）。
  # Phase 6 の実機検証で MBP のリソース消費を計測して確定する（qu-e.yaml の上限値と揃える）。
  max_heavy_instances: 3

# フォールバック設定（昇格ラダー routing.escalation.ladder による段階昇格）
# primary モデル（matrix で解決）が失敗 / ESCALATE 申告 / 例外・タイムアウト時、ladder の
# 次段へ昇格して再実行する。max_fallback_attempts は「primary を起点とした最大昇格段数」を制限。
# 値の意味: 昇格回数（primary は含まない）
#   0 = 昇格なし（primary のみ）、1 = primary + 1 段、N = primary + N 段
# 未指定（コメントアウト）の場合: ladder の末尾（opus）まで昇格（無制限）
# ユーザーが `:モデル名` を明示指定した場合は昇格しない（指定モデル尊重）
fallback:
  # max_fallback_attempts: 1     # 値を指定して制限する場合のみ有効化

# 判定ログ
logging:
  decision_log_dir: "/opt/taka-ma/logs"
